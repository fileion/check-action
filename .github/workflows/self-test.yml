name: Self-test

# By hand only (free minutes are limited). Run it before a release: gh workflow run Self-test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS bills 10x, so it is left out. For a release, add macos-latest back to this list for one run, then remove it.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Make a known file (a Fileion-listed release zip) and an unknown one
        shell: bash
        run: |
          set -euo pipefail
          mkdir files
          curl --fail --silent --show-error --location --retry 3 -o files/known.zip https://github.com/TechUnRestricted/WinDiskWriter/releases/download/v1.0.0/WinDiskWriter.1.0.zip
          if command -v sha256sum >/dev/null 2>&1; then got=$(sha256sum files/known.zip | cut -c1-64); else got=$(shasum -a 256 files/known.zip | cut -c1-64); fi
          test "$got" = 582b5e4c7506c5014cb656a600df48012b2fca1f6e9c7f3c0933dea6fa463d84
          printf 'not a real build %s %s\n' "$GITHUB_RUN_ID" "$RANDOM" > files/unknown.txt

      - name: Run the action
        id: check
        uses: ./
        with:
          files: files/*

      - name: The known file is listed and the unknown one is not
        shell: bash
        env:
          LISTED: ${{ steps.check.outputs.listed }}
          NOT_LISTED: ${{ steps.check.outputs.not-listed }}
        run: |
          test "$LISTED" = 1
          test "$NOT_LISTED" = 1

      - name: fail-on unknown fails on the unknown file
        id: strict
        continue-on-error: true
        uses: ./
        with:
          files: files/unknown.txt
          fail-on: unknown

      - name: That step really failed
        shell: bash
        env:
          OUTCOME: ${{ steps.strict.outcome }}
        run: test "$OUTCOME" = failure

      - name: A pattern that matches nothing fails, even next to one that matches
        id: missing
        continue-on-error: true
        uses: ./
        with:
          files: |
            files/*.zip
            files/*.nomatch

      - name: That step really failed and checked nothing
        shell: bash
        env:
          OUTCOME: ${{ steps.missing.outcome }}
          LISTED: ${{ steps.missing.outputs.listed }}
        run: |
          test "$OUTCOME" = failure
          test -z "$LISTED"
